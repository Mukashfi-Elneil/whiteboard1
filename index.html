<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>سبورة أوزموزيس الذكية — Osmosis Studio Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <style>
    :root {
      --bg-ui: rgba(255, 255, 255, 0.94);
      --border-ui: rgba(15, 23, 42, 0.12);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-2: #06b6d4;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f8fafc; color: var(--text-main);
    }
    #canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      touch-action: none; display: block; cursor: crosshair;
    }
    .topbar {
      position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px;
      margin-top: 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--bg-ui); backdrop-filter: blur(12px);
      border: 1px solid var(--border-ui); border-radius: 16px;
      padding: 6px 12px; box-shadow: var(--shadow); z-index: 30;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
    .brand-badge {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 16px;
    }
    .group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    button, select {
      border: 1px solid var(--border-ui); background: #fff; color: var(--text-main);
      border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }
    button:active { transform: scale(0.96); }
    button.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), #4338ca);
      color: #fff; border: none;
    }
    button.success {
      background: var(--success); color: #fff; border: none;
    }
    button.danger { color: var(--danger); }
    .dock {
      position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px;
      background: var(--bg-ui); backdrop-filter: blur(12px);
      border: 1px solid var(--border-ui); border-radius: 18px;
      padding: 8px; box-shadow: var(--shadow); z-index: 30;
    }
    .dock button { width: 42px; height: 42px; justify-content: center; padding: 0; font-size: 16px; border-radius: 12px; }
    .color-dot {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2); cursor: pointer;
    }
    .color-dot.active { box-shadow: 0 0 0 2.5px var(--accent); transform: scale(1.1); }
    .timeline-bar {
      position: fixed; bottom: env(safe-area-inset-bottom, 10px); left: 12px; right: 12px;
      margin-bottom: 8px;
      background: var(--bg-ui); backdrop-filter: blur(12px);
      border: 1px solid var(--border-ui); border-radius: 18px;
      padding: 8px 14px; box-shadow: var(--shadow); z-index: 30;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .timeline-bar input[type="range"] { flex: 1; min-width: 140px; accent-color: var(--accent); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      display: none; place-items: center; z-index: 60; padding: 16px;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      background: #fff; border-radius: 20px; width: min(560px, 100%);
      max-height: 85vh; overflow: auto; padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    }
    .project-card {
      border: 1px solid var(--border-ui); border-radius: 14px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px;
    }
    body.studio-clean .topbar,
    body.studio-clean .dock,
    body.studio-clean .timeline-bar { opacity: 0.08; transition: opacity 0.2s; }
    body.studio-clean .topbar:hover,
    body.studio-clean .dock:hover,
    body.studio-clean .timeline-bar:hover { opacity: 1; }
    .exit-clean {
      position: fixed; top: 12px; left: 12px; z-index: 50; display: none;
    }
    body.studio-clean .exit-clean { display: inline-flex; }
    @media (max-width: 720px) {
      .dock {
        top: auto; bottom: 76px; right: 10px; left: 10px; transform: none;
        flex-direction: row; justify-content: center; flex-wrap: wrap;
      }
      .timeline-bar { padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <button class="exit-clean primary" id="btnExitClean">إظهار القوائم</button>

  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">Ω</div>
      <span>أوزموزيس ستوديو</span>
      <span id="saveBadge" style="font-size:11px;color:var(--success);font-weight:700;">محفوظ ✓</span>
    </div>

    <div class="group">
      <button id="btnProjects">📁 المشاريع</button>
      <button id="btnUndo" title="تراجع">↩️</button>
      <button id="btnRedo" title="إعادة">↪️</button>
      <select id="bgPattern" title="نمط الخلفية">
        <option value="dots">نقاط (Miro)</option>
        <option value="grid">مربعات (Grid)</option>
        <option value="ruled">مسطرة (Notability)</option>
        <option value="isometric">هندسي</option>
        <option value="blank">صافية</option>
      </select>
      <select id="bgTheme" title="لون الخلفية">
        <option value="#f8fafc">أبيض ناعم</option>
        <option value="#fefce8">ورق دافئ</option>
        <option value="#ecfdf5">نعناعي هادئ</option>
        <option value="#f0f9ff">سماوي فاتح</option>
        <option value="#0f172a">ليلي داكن</option>
      </select>
    </div>

    <div class="group">
      <button id="btnZoomOut">➖</button>
      <span id="zoomLabel" style="font-size:12px;font-weight:700;min-width:44px;text-align:center;">100%</span>
      <button id="btnZoomIn">➕</button>
      <button id="btnFit">⛶ احتواء</button>
      <button id="btnStudioClean" title="وضع التسجيل النظيف">🎬 تسجيل</button>
    </div>
  </div>

  <div class="dock" id="toolDock">
    <button data-tool="pen" class="active" title="قلم حبر">✒️</button>
    <button data-tool="highlighter" title="تظليل">🖍️</button>
    <button data-tool="eraser" title="ممحاة">🧽</button>
    <button data-tool="select" title="تحديد وتحريك (يسجل الحركة)">👆</button>
    <button data-tool="pan" title="تحريك اللوحة">✋</button>
    <button data-tool="arrow" title="سهم">↗️</button>
    <button data-tool="rect" title="مستطيل">▭</button>
    <button data-tool="circle" title="دائرة">◯</button>
    <button data-tool="text" title="نص">🔤</button>
    <button id="btnInsertImg" title="إدراج صورة بزوايا دائرية">🖼️</button>
    <input type="file" id="imgInput" accept="image/*" hidden />
    <div style="height:1px;background:var(--border-ui);margin:2px 0;"></div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:42px;">
      <span class="color-dot active" data-color="#1e293b" style="background:#1e293b"></span>
      <span class="color-dot" data-color="#4f46e5" style="background:#4f46e5"></span>
      <span class="color-dot" data-color="#0284c7" style="background:#0284c7"></span>
      <span class="color-dot" data-color="#059669" style="background:#059669"></span>
      <span class="color-dot" data-color="#dc2626" style="background:#dc2626"></span>
      <span class="color-dot" data-color="#f59e0b" style="background:#f59e0b"></span>
    </div>
    <select id="strokeSize" style="width:42px;padding:4px 2px;text-align:center;" title="سمك القلم">
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="7">7</option>
      <option value="12">12</option>
    </select>
  </div>

  <div class="timeline-bar">
    <button id="btnPlay" class="primary">▶️ تشغيل الأنيميشن</button>
    <button id="btnRestart">⏮️</button>
    <button id="btnStep">⏭️ خطوة</button>
    <button id="btnEditMode" class="active">✏️ تحرير</button>
    <input type="range" id="scrubber" min="0" max="1000" value="1000" />
    <span id="timeLabel" style="font-size:12px;font-weight:700;min-width:74px;">0.0 / 0.0s</span>
    <select id="speedSelect" title="سرعة الأنيميشن">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="camFollow" checked /> تتبع الكاميرا
    </label>
  </div>

  <div class="modal-backdrop" id="projectsModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">📁 المشاريع والحفظ</h3>
        <button id="btnCloseProjects">✕</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
        <button id="btnNewBlank" class="primary">+ مشروع جديد فارغ</button>
        <button id="btnNewDemo">+ درس الأسموزية التوضيحي</button>
        <button id="btnExportJson">⬇️ تصدير JSON</button>
        <button id="btnImportJson">⬆️ استيراد JSON</button>
        <input type="file" id="jsonInput" accept=".json" hidden />
      </div>
      <div id="projectsList" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const STORAGE_KEY = "osmosis_studio_projects_v1";
    const ACTIVE_KEY = "osmosis_studio_active_v1";

    let projects = {};
    let currentProjectId = null;

    const state = {
      items: [],
      undoStack: [],
      redoStack: [],
      tool: "pen",
      color: "#1e293b",
      size: 4,
      bgPattern: "dots",
      bgTheme: "#f8fafc",
      cam: { x: 0, y: 0, zoom: 1 },
      selectedId: null,
      playback: {
        mode: false,
        playing: false,
        time: 0,
        totalDuration: 0,
        speed: 1,
        stepTargetEnd: null,
        lastTs: 0
      }
    };

    const imageCache = new Map();
    let renderQueued = false;
    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        render();
      });
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scheduleRender();
    }
    window.addEventListener("resize", resize);

    function screenToWorld(sx, sy) {
      return {
        x: (sx - window.innerWidth / 2) / state.cam.zoom + state.cam.x,
        y: (sy - window.innerHeight / 2) / state.cam.zoom + state.cam.y
      };
    }

    function worldToScreen(wx, wy) {
      return {
        x: (wx - state.cam.x) * state.cam.zoom + window.innerWidth / 2,
        y: (wy - state.cam.y) * state.cam.zoom + window.innerHeight / 2
      };
    }

    function rebuildTimeline() {
      let t = 0;
      for (const item of state.items) {
        item.startTime = t;
        let dur = 0.7;
        if (item.type === "stroke" || item.type === "highlighter") {
          const pts = item.points ? item.points.length : 1;
          dur = Math.max(0.35, Math.min(2.6, pts * 0.018));
        } else if (item.type === "text") {
          dur = Math.max(0.5, Math.min(2.0, (item.text || "").length * 0.04));
        } else if (item.type === "image") {
          dur = 0.75;
        }
        item.duration = dur;
        item.endTime = t + dur;
        t = item.endTime + 0.12;

        if (item.motions && item.motions.length) {
          for (const m of item.motions) {
            m.startTime = t;
            m.duration = 0.9;
            m.endTime = t + m.duration;
            t = m.endTime + 0.1;
          }
        }
      }
      state.playback.totalDuration = Math.max(0, t);
      if (!state.playback.mode) {
        state.playback.time = state.playback.totalDuration;
      }
      syncTimelineUI();
    }

    function syncTimelineUI() {
      const total = state.playback.totalDuration;
      const cur = Math.min(state.playback.time, total);
      document.getElementById("timeLabel").textContent = `${cur.toFixed(1)} / ${total.toFixed(1)}s`;
      document.getElementById("scrubber").value = total > 0 ? Math.round((cur / total) * 1000) : 1000;
      document.getElementById("btnPlay").textContent = state.playback.playing ? "⏸️ إيقاف مؤقت" : "▶️ تشغيل الأنيميشن";
      document.getElementById("btnEditMode").classList.toggle("active", !state.playback.mode);
    }

    let saveTimer = null;
    function queueSave() {
      document.getElementById("saveBadge").textContent = "جارٍ الحفظ...";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          if (!currentProjectId) currentProjectId = "proj_" + Date.now();
          projects[currentProjectId] = {
            id: currentProjectId,
            title: projects[currentProjectId]?.title || "درس تعليمي " + Object.keys(projects).length,
            updatedAt: Date.now(),
            bgPattern: state.bgPattern,
            bgTheme: state.bgTheme,
            cam: state.cam,
            items: state.items
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
          localStorage.setItem(ACTIVE_KEY, currentProjectId);
          document.getElementById("saveBadge").textContent = "محفوظ ✓";
        } catch (e) {
          document.getElementById("saveBadge").textContent = "مساحة ممتلئة";
        }
      }, 350);
    }

    function pushUndo() {
      state.undoStack.push(JSON.stringify(state.items));
      if (state.undoStack.length > 40) state.undoStack.shift();
      state.redoStack = [];
    }

    function getItemBounds(item) {
      if (item.points && item.points.length) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const p of item.points) {
          if (p.x < minX) minX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.x > maxX) maxX = p.x;
          if (p.y > maxY) maxY = p.y;
        }
        return { x: minX - 10, y: minY - 10, w: Math.max(24, maxX - minX + 20), h: Math.max(24, maxY - minY + 20) };
      }
      if (item.type === "text") {
        const w = Math.max(60, (item.text || "").length * (item.size || 24) * 0.55);
        const h = (item.size || 24) * 1.4;
        return { x: item.x - w, y: item.y - h * 0.8, w, h };
      }
      const x = Math.min(item.x, item.x + (item.w || 0));
      const y = Math.min(item.y, item.y + (item.h || 0));
      return { x, y, w: Math.abs(item.w || 40), h: Math.abs(item.h || 40) };
    }

    function getAnimatedOffset(item, t) {
      let dx = 0, dy = 0;
      if (!item.motions) return { dx, dy };
      for (const m of item.motions) {
        if (t >= m.endTime) {
          dx += m.dx; dy += m.dy;
        } else if (t > m.startTime) {
          const raw = (t - m.startTime) / Math.max(0.001, m.duration);
          const ease = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
          dx += m.dx * ease;
          dy += m.dy * ease;
        }
      }
      return { dx, dy };
    }

    function drawBackground() {
      const w = window.innerWidth, h = window.innerHeight;
      ctx.fillStyle = state.bgTheme;
      ctx.fillRect(0, 0, w, h);
      if (state.bgPattern === "blank") return;

      const isDark = state.bgTheme === "#0f172a";
      ctx.strokeStyle = isDark ? "rgba(255,255,255,0.08)" : "rgba(15,23,42,0.08)";
      ctx.fillStyle = isDark ? "rgba(255,255,255,0.18)" : "rgba(15,23,42,0.18)";

      const step = 32 * state.cam.zoom;
      if (step < 6) return;
      const ox = (w / 2 - state.cam.x * state.cam.zoom) % step;
      const oy = (h / 2 - state.cam.y * state.cam.zoom) % step;

      if (state.bgPattern === "dots") {
        for (let x = ox; x < w; x += step) {
          for (let y = oy; y < h; y += step) {
            ctx.beginPath();
            ctx.arc(x, y, 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (state.bgPattern === "grid") {
        ctx.beginPath();
        for (let x = ox; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
        for (let y = oy; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
        ctx.stroke();
      } else if (state.bgPattern === "ruled") {
        ctx.beginPath();
        for (let y = oy; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
        ctx.stroke();
      } else if (state.bgPattern === "isometric") {
        ctx.beginPath();
        for (let x = ox - h; x < w + h; x += step) {
          ctx.moveTo(x, 0); ctx.lineTo(x + h * 0.58, h);
          ctx.moveTo(x, 0); ctx.lineTo(x - h * 0.58, h);
        }
        ctx.stroke();
      }
    }

    function drawRoundedImage(img, x, y, w, h, r) {
      const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.clip();
      ctx.drawImage(img, x, y, w, h);
      ctx.restore();
      ctx.strokeStyle = "rgba(79,70,229,0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.stroke();
    }

    function drawItem(item, t, activeFocus) {
      if (state.playback.mode && t < item.startTime) return;
      const progress = state.playback.mode
        ? Math.min(1, Math.max(0, (t - item.startTime) / Math.max(0.001, item.duration)))
        : 1;

      const { dx, dy } = getAnimatedOffset(item, state.playback.mode ? t : state.playback.totalDuration);

      ctx.save();
      ctx.translate(dx, dy);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (item.type === "stroke" || item.type === "highlighter") {
        const pts = item.points || [];
        const count = Math.max(1, Math.ceil(pts.length * progress));
        ctx.globalAlpha = item.type === "highlighter" ? 0.34 : 1;
        ctx.strokeStyle = item.color;
        ctx.lineWidth = item.type === "highlighter" ? item.size * 4 : item.size;
        ctx.beginPath();
        if (count === 1) {
          ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
          ctx.fillStyle = item.color;
          ctx.fill();
        } else {
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < count; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
        if (activeFocus && count > 0) {
          activeFocus.x = pts[count - 1].x + dx;
          activeFocus.y = pts[count - 1].y + dy;
        }
      } else if (item.type === "rect") {
        ctx.globalAlpha = progress;
        ctx.strokeStyle = item.color;
        ctx.lineWidth = item.size;
        ctx.beginPath();
        ctx.roundRect(item.x, item.y, item.w * progress, item.h * progress, 12);
        ctx.stroke();
        if (activeFocus) { activeFocus.x = item.x + item.w / 2 + dx; activeFocus.y = item.y + item.h / 2 + dy; }
      } else if (item.type === "circle") {
        ctx.strokeStyle = item.color;
        ctx.lineWidth = item.size;
        ctx.beginPath();
        ctx.ellipse(
          item.x + item.w / 2, item.y + item.h / 2,
          Math.abs(item.w / 2), Math.abs(item.h / 2),
          0, 0, Math.PI * 2 * progress
        );
        ctx.stroke();
        if (activeFocus) { activeFocus.x = item.x + item.w / 2 + dx; activeFocus.y = item.y + item.h / 2 + dy; }
      } else if (item.type === "arrow") {
        const x2 = item.x + item.w * progress;
        const y2 = item.y + item.h * progress;
        ctx.strokeStyle = item.color;
        ctx.fillStyle = item.color;
        ctx.lineWidth = item.size;
        ctx.beginPath();
        ctx.moveTo(item.x, item.y);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        if (progress > 0.2) {
          const ang = Math.atan2(item.h, item.w);
          const head = 12 + item.size;
          ctx.beginPath();
          ctx.moveTo(x2, y2);
          ctx.lineTo(x2 - head * Math.cos(ang - 0.45), y2 - head * Math.sin(ang - 0.45));
          ctx.lineTo(x2 - head * Math.cos(ang + 0.45), y2 - head * Math.sin(ang + 0.45));
          ctx.closePath();
          ctx.fill();
        }
        if (activeFocus) { activeFocus.x = x2 + dx; activeFocus.y = y2 + dy; }
      } else if (item.type === "text") {
        const chars = Math.max(1, Math.ceil((item.text || "").length * progress));
        ctx.fillStyle = item.color;
        ctx.font = `700 ${item.size || 24}px system-ui, sans-serif`;
        ctx.textAlign = "right";
        ctx.fillText((item.text || "").slice(0, chars), item.x, item.y);
        if (activeFocus) { activeFocus.x = item.x - 60 + dx; activeFocus.y = item.y + dy; }
      } else if (item.type === "image") {
        let img = imageCache.get(item.src);
        if (!img) {
          img = new Image();
          img.onload = scheduleRender;
          img.src = item.src;
          imageCache.set(item.src, img);
        }
        if (img.complete && img.naturalWidth > 0) {
          ctx.globalAlpha = progress;
          const scale = 0.92 + 0.08 * progress;
          const cx = item.x + item.w / 2;
          const cy = item.y + item.h / 2;
          ctx.translate(cx, cy);
          ctx.scale(scale, scale);
          ctx.translate(-cx, -cy);
          drawRoundedImage(img, item.x, item.y, item.w, item.h, item.borderRadius ?? 24);
        }
        if (activeFocus) { activeFocus.x = item.x + item.w / 2 + dx; activeFocus.y = item.y + item.h / 2 + dy; }
      }

      if (!state.playback.mode && item.id === state.selectedId) {
        const b = getItemBounds(item);
        ctx.strokeStyle = "#4f46e5";
        ctx.lineWidth = 1.5 / state.cam.zoom;
        ctx.setLineDash([5 / state.cam.zoom, 4 / state.cam.zoom]);
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }
      ctx.restore();
    }

    function render() {
      drawBackground();
      ctx.save();
      ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
      ctx.scale(state.cam.zoom, state.cam.zoom);
      ctx.translate(-state.cam.x, -state.cam.y);

      const t = state.playback.time;
      const focus = { x: null, y: null };

      for (const item of state.items) {
        if (item.type === "highlighter") drawItem(item, t, focus);
      }
      for (const item of state.items) {
        if (item.type !== "highlighter") drawItem(item, t, focus);
      }

      if (state.playback.mode && state.playback.playing && document.getElementById("camFollow").checked && focus.x !== null) {
        state.cam.x += (focus.x - state.cam.x) * 0.08;
        state.cam.y += (focus.y - state.cam.y) * 0.08;
      }

      ctx.restore();
    }

    // Pointer / Drawing / Moving logic
    let activePointer = null;
    let draftItem = null;
    let dragStartWorld = null;
    let panStartCam = null;
    let panStartScreen = null;
    let dragOffsetAcc = { dx: 0, dy: 0 };

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      activePointer = e.pointerId;
      const wPos = screenToWorld(e.clientX, e.clientY);

      if (state.playback.mode && state.tool !== "pan") {
        state.playback.mode = false;
        state.playback.playing = false;
        state.playback.time = state.playback.totalDuration;
        syncTimelineUI();
      }

      if (state.tool === "pan" || e.button === 1) {
        panStartCam = { ...state.cam };
        panStartScreen = { x: e.clientX, y: e.clientY };
        return;
      }

      if (state.tool === "select") {
        const finalT = state.playback.totalDuration;
        let hit = null;
        for (let i = state.items.length - 1; i >= 0; i--) {
          const it = state.items[i];
          const off = getAnimatedOffset(it, finalT);
          const b = getItemBounds(it);
          if (wPos.x >= b.x + off.dx && wPos.x <= b.x + b.w + off.dx &&
              wPos.y >= b.y + off.dy && wPos.y <= b.y + b.h + off.dy) {
            hit = it;
            break;
          }
        }
        state.selectedId = hit ? hit.id : null;
        dragStartWorld = wPos;
        dragOffsetAcc = { dx: 0, dy: 0 };
        scheduleRender();
        return;
      }

      if (state.tool === "eraser") {
        pushUndo();
        eraseAt(wPos);
        return;
      }

      if (state.tool === "text") {
        const txt = prompt("أدخل النص التعليمي:");
        if (txt && txt.trim()) {
          pushUndo();
          state.items.push({
            id: "it_" + Date.now(),
            type: "text",
            text: txt.trim(),
            x: wPos.x,
            y: wPos.y,
            color: state.color,
            size: Math.max(20, state.size * 6)
          });
          rebuildTimeline();
          queueSave();
          scheduleRender();
        }
        return;
      }

      pushUndo();
      if (state.tool === "pen" || state.tool === "highlighter") {
        draftItem = {
          id: "it_" + Date.now(),
          type: state.tool === "highlighter" ? "highlighter" : "stroke",
          color: state.color,
          size: state.size,
          points: [wPos]
        };
      } else if (state.tool === "rect" || state.tool === "circle" || state.tool === "arrow") {
        draftItem = {
          id: "it_" + Date.now(),
          type: state.tool,
          color: state.color,
          size: state.size,
          x: wPos.x,
          y: wPos.y,
          w: 1,
          h: 1
        };
      }
      if (draftItem) {
        state.items.push(draftItem);
        scheduleRender();
      }
    });

    function eraseAt(wPos) {
      const r = 18 / state.cam.zoom;
      const before = state.items.length;
      state.items = state.items.filter((it) => {
        const off = getAnimatedOffset(it, state.playback.totalDuration);
        const b = getItemBounds(it);
        return !(wPos.x >= b.x + off.dx - r && wPos.x <= b.x + b.w + off.dx + r &&
                 wPos.y >= b.y + off.dy - r && wPos.y <= b.y + b.h + off.dy + r);
      });
      if (state.items.length !== before) {
        rebuildTimeline();
        queueSave();
        scheduleRender();
      }
    }

    canvas.addEventListener("pointermove", (e) => {
      if (activePointer !== e.pointerId) return;
      const wPos = screenToWorld(e.clientX, e.clientY);

      if (panStartCam) {
        state.cam.x = panStartCam.x - (e.clientX - panStartScreen.x) / state.cam.zoom;
        state.cam.y = panStartCam.y - (e.clientY - panStartScreen.y) / state.cam.zoom;
        scheduleRender();
        return;
      }

      if (state.tool === "eraser") {
        eraseAt(wPos);
        return;
      }

      if (state.tool === "select" && state.selectedId && dragStartWorld) {
        const it = state.items.find(x => x.id === state.selectedId);
        if (it) {
          const dx = wPos.x - dragStartWorld.x;
          const dy = wPos.y - dragStartWorld.y;
          dragStartWorld = wPos;
          dragOffsetAcc.dx += dx;
          dragOffsetAcc.dy += dy;
          if (!it._liveMotion) {
            pushUndo();
            it.motions = it.motions || [];
            it._liveMotion = { dx: 0, dy: 0 };
            it.motions.push(it._liveMotion);
          }
          it._liveMotion.dx = dragOffsetAcc.dx;
          it._liveMotion.dy = dragOffsetAcc.dy;
          rebuildTimeline();
          scheduleRender();
        }
        return;
      }

      if (!draftItem) return;
      if (draftItem.points) {
        draftItem.points.push(wPos);
      } else {
        draftItem.w = wPos.x - draftItem.x;
        draftItem.h = wPos.y - draftItem.y;
      }
      scheduleRender();
    });

    function endPointer(e) {
      if (activePointer !== e.pointerId) return;
      activePointer = null;
      panStartCam = null;
      dragStartWorld = null;
      if (state.selectedId) {
        const it = state.items.find(x => x.id === state.selectedId);
        if (it && it._liveMotion) {
          delete it._liveMotion;
          rebuildTimeline();
          queueSave();
        }
      }
      if (draftItem) {
        draftItem = null;
        rebuildTimeline();
        queueSave();
        scheduleRender();
      }
    }
    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);

    // Wheel Zoom around cursor
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const before = screenToWorld(e.clientX, e.clientY);
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      state.cam.zoom = Math.max(0.15, Math.min(6, state.cam.zoom * factor));
      const after = screenToWorld(e.clientX, e.clientY);
      state.cam.x += before.x - after.x;
      state.cam.y += before.y - after.y;
      document.getElementById("zoomLabel").textContent = Math.round(state.cam.zoom * 100) + "%";
      scheduleRender();
    }, { passive: false });

    // Animation Playback Loop
    function tick(ts) {
      if (state.playback.playing) {
        if (!state.playback.lastTs) state.playback.lastTs = ts;
        const dt = ((ts - state.playback.lastTs) / 1000) * state.playback.speed;
        state.playback.lastTs = ts;
        state.playback.time += dt;

        if (state.playback.stepTargetEnd !== null && state.playback.time >= state.playback.stepTargetEnd) {
          state.playback.time = state.playback.stepTargetEnd;
          state.playback.playing = false;
          state.playback.stepTargetEnd = null;
        } else if (state.playback.time >= state.playback.totalDuration) {
          state.playback.time = state.playback.totalDuration;
          state.playback.playing = false;
        }
        syncTimelineUI();
        scheduleRender();
      } else {
        state.playback.lastTs = 0;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // UI Controls
    document.querySelectorAll("#toolDock button[data-tool]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#toolDock button[data-tool]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.tool = btn.dataset.tool;
      });
    });

    document.querySelectorAll(".color-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
        dot.classList.add("active");
        state.color = dot.dataset.color;
      });
    });

    document.getElementById("strokeSize").addEventListener("change", (e) => state.size = Number(e.target.value));
    document.getElementById("bgPattern").addEventListener("change", (e) => { state.bgPattern = e.target.value; queueSave(); scheduleRender(); });
    document.getElementById("bgTheme").addEventListener("change", (e) => {
      state.bgTheme = e.target.value;
      if (state.bgTheme === "#0f172a" && state.color === "#1e293b") state.color = "#f8fafc";
      queueSave();
      scheduleRender();
    });

    document.getElementById("btnZoomIn").addEventListener("click", () => {
      state.cam.zoom = Math.min(6, state.cam.zoom * 1.2);
      document.getElementById("zoomLabel").textContent = Math.round(state.cam.zoom * 100) + "%";
      scheduleRender();
    });
    document.getElementById("btnZoomOut").addEventListener("click", () => {
      state.cam.zoom = Math.max(0.15, state.cam.zoom / 1.2);
      document.getElementById("zoomLabel").textContent = Math.round(state.cam.zoom * 100) + "%";
      scheduleRender();
    });
    document.getElementById("btnFit").addEventListener("click", () => {
      if (!state.items.length) { state.cam = { x: 0, y: 0, zoom: 1 }; scheduleRender(); return; }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const it of state.items) {
        const b = getItemBounds(it);
        minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
        maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
      }
      state.cam.x = (minX + maxX) / 2;
      state.cam.y = (minY + maxY) / 2;
      state.cam.zoom = Math.max(0.25, Math.min(1.5, Math.min((window.innerWidth - 160) / (maxX - minX + 80), (window.innerHeight - 200) / (maxY - minY + 80))));
      document.getElementById("zoomLabel").textContent = Math.round(state.cam.zoom * 100) + "%";
      scheduleRender();
    });

    document.getElementById("btnStudioClean").addEventListener("click", () => document.body.classList.add("studio-clean"));
    document.getElementById("btnExitClean").addEventListener("click", () => document.body.classList.remove("studio-clean"));

    document.getElementById("btnUndo").addEventListener("click", () => {
      if (!state.undoStack.length) return;
      state.redoStack.push(JSON.stringify(state.items));
      state.items = JSON.parse(state.undoStack.pop());
      rebuildTimeline(); queueSave(); scheduleRender();
    });
    document.getElementById("btnRedo").addEventListener("click", () => {
      if (!state.redoStack.length) return;
      state.undoStack.push(JSON.stringify(state.items));
      state.items = JSON.parse(state.redoStack.pop());
      rebuildTimeline(); queueSave(); scheduleRender();
    });

    // Image insertion with rounded corners
    document.getElementById("btnInsertImg").addEventListener("click", () => document.getElementById("imgInput").click());
    document.getElementById("imgInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const w = Math.min(340, img.naturalWidth || 260);
          const h = w * ((img.naturalHeight || 200) / (img.naturalWidth || 260));
          pushUndo();
          state.items.push({
            id: "it_" + Date.now(),
            type: "image",
            src: reader.result,
            x: state.cam.x - w / 2,
            y: state.cam.y - h / 2,
            w, h,
            borderRadius: 24
          });
          rebuildTimeline();
          queueSave();
          scheduleRender();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    // Playback Controls
    document.getElementById("btnPlay").addEventListener("click", () => {
      state.playback.mode = true;
      state.playback.stepTargetEnd = null;
      if (state.playback.time >= state.playback.totalDuration) state.playback.time = 0;
      state.playback.playing = !state.playback.playing;
      syncTimelineUI();
      scheduleRender();
    });

    document.getElementById("btnRestart").addEventListener("click", () => {
      state.playback.mode = true;
      state.playback.time = 0;
      state.playback.playing = true;
      syncTimelineUI();
      scheduleRender();
    });

    document.getElementById("btnStep").addEventListener("click", () => {
      state.playback.mode = true;
      if (state.playback.time >= state.playback.totalDuration) state.playback.time = 0;
      const next = state.items.find(it => it.endTime > state.playback.time + 0.02);
      if (next) {
        state.playback.stepTargetEnd = next.endTime;
        state.playback.playing = true;
      }
      syncTimelineUI();
    });

    document.getElementById("btnEditMode").addEventListener("click", () => {
      state.playback.mode = false;
      state.playback.playing = false;
      state.playback.time = state.playback.totalDuration;
      syncTimelineUI();
      scheduleRender();
    });

    document.getElementById("scrubber").addEventListener("input", (e) => {
      state.playback.mode = true;
      state.playback.playing = false;
      state.playback.time = (Number(e.target.value) / 1000) * state.playback.totalDuration;
      syncTimelineUI();
      scheduleRender();
    });

    document.getElementById("speedSelect").addEventListener("change", (e) => {
      state.playback.speed = Number(e.target.value);
    });

    // Demo Lesson
    function loadDemoLesson() {
      currentProjectId = "proj_" + Date.now();
      state.items = [
        { id: "d1", type: "text", text: "الخاصية الأسموزية (Osmosis)", x: 180, y: -150, color: "#4f46e5", size: 30 },
        { id: "d2", type: "rect", x: -240, y: -90, w: 480, h: 220, color: "#0284c7", size: 4 },
        { id: "d3", type: "arrow", x: 0, y: -90, w: 0, h: 220, color: "#64748b", size: 3 },
        { id: "d4", type: "text", text: "تركيز ماء مرتفع", x: -60, y: -20, color: "#059669", size: 22 },
        { id: "d5", type: "text", text: "تركيز ماء منخفض", x: 215, y: -20, color: "#dc2626", size: 22 },
        { id: "d6", type: "arrow", x: -60, y: 40, w: 130, h: 0, color: "#06b6d4", size: 5 }
      ];
      state.cam = { x: 0, y: 0, zoom: 1 };
      state.playback.mode = false;
      rebuildTimeline();
      queueSave();
      scheduleRender();
    }

    // Projects Modal
    function renderProjectsList() {
      const box = document.getElementById("projectsList");
      const list = Object.values(projects).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      box.innerHTML = list.map(p => `
        <div class="project-card">
          <div>
            <strong>${p.title}</strong>
            <div style="font-size:11px;color:var(--text-muted);">${(p.items || []).length} عنصر</div>
          </div>
          <div style="display:flex;gap:6px;">
            <button onclick="openProject('${p.id}')" class="primary">فتح</button>
            <button onclick="deleteProject('${p.id}')" class="danger">حذف</button>
          </div>
        </div>
      `).join("") || "<p style='color:var(--text-muted);font-size:13px;'>لا توجد مشاريع محفوظة بعد.</p>";
    }

    window.openProject = (id) => {
      const p = projects[id];
      if (!p) return;
      currentProjectId = p.id;
      state.items = JSON.parse(JSON.stringify(p.items || []));
      state.bgPattern = p.bgPattern || "dots";
      state.bgTheme = p.bgTheme || "#f8fafc";
      state.cam = p.cam || { x: 0, y: 0, zoom: 1 };
      document.getElementById("bgPattern").value = state.bgPattern;
      document.getElementById("bgTheme").value = state.bgTheme;
      state.playback.mode = false;
      rebuildTimeline();
      scheduleRender();
      document.getElementById("projectsModal").classList.remove("open");
    };

    window.deleteProject = (id) => {
      delete projects[id];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
      renderProjectsList();
    };

    document.getElementById("btnProjects").addEventListener("click", () => {
      renderProjectsList();
      document.getElementById("projectsModal").classList.add("open");
    });
    document.getElementById("btnCloseProjects").addEventListener("click", () => document.getElementById("projectsModal").classList.remove("open"));
    document.getElementById("btnNewBlank").addEventListener("click", () => {
      currentProjectId = "proj_" + Date.now();
      state.items = [];
      state.cam = { x: 0, y: 0, zoom: 1 };
      state.playback.mode = false;
      rebuildTimeline();
      queueSave();
      scheduleRender();
      document.getElementById("projectsModal").classList.remove("open");
    });
    document.getElementById("btnNewDemo").addEventListener("click", () => {
      loadDemoLesson();
      document.getElementById("projectsModal").classList.remove("open");
    });

    document.getElementById("btnExportJson").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ bgPattern: state.bgPattern, bgTheme: state.bgTheme, items: state.items }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "osmosis-lesson.json";
      a.click();
    });
    document.getElementById("btnImportJson").addEventListener("click", () => document.getElementById("jsonInput").click());
    document.getElementById("jsonInput").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          currentProjectId = "proj_" + Date.now();
          state.items = data.items || [];
          state.bgPattern = data.bgPattern || "dots";
          state.bgTheme = data.bgTheme || "#f8fafc";
          rebuildTimeline(); queueSave(); scheduleRender();
          document.getElementById("projectsModal").classList.remove("open");
        } catch (_) { alert("ملف غير صالح"); }
      };
      r.readAsText(f);
    });

    // Boot
    resize();
    try {
      projects = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const lastId = localStorage.getItem(ACTIVE_KEY);
      if (lastId && projects[lastId]) {
        openProject(lastId);
      } else {
        loadDemoLesson();
      }
    } catch (_) {
      loadDemoLesson();
    }
  </script>
</body>
</html>
